# Local production site for http://time.log (127.0.0.1 time.log in /etc/hosts).
# Installed as /opt/homebrew/etc/nginx/servers/time.log.conf; reload with `brew services restart nginx`.
# Puma runs from ~/apps/timelog (see bin/prod-deploy) on 127.0.0.1:3010.

upstream timelog_puma {
  server 127.0.0.1:3010 fail_timeout=0;
}

server {
  # macOS lets a non-root process bind port 80 only on the wildcard address,
  # so restrict access to this machine below instead.
  listen 80;
  listen [::]:80;
  server_name time.log;

  allow 127.0.0.1;
  allow ::1;
  deny all;

  root /Users/erwinseribo/apps/timelog/public;
  client_max_body_size 20m;

  access_log /opt/homebrew/var/log/nginx/time.log.access.log;
  error_log  /opt/homebrew/var/log/nginx/time.log.error.log;

  # Fingerprinted assets from bin/rails assets:precompile
  location /assets/ {
    expires max;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri @puma;
  }

  location @puma {
    proxy_pass http://timelog_puma;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
